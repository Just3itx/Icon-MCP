<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#101020"/>
    </linearGradient>
    <!-- Box gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a07048"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b08050"/>
      <stop offset="100%" stop-color="#7d5a38"/>
    </linearGradient>
    <linearGradient id="flapL" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#e8c49a"/>
    </linearGradient>
    <linearGradient id="flapR" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#dbb088"/>
      <stop offset="100%" stop-color="#ecd0ae"/>
    </linearGradient>
    <linearGradient id="flapBack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c09060"/>
      <stop offset="100%" stop-color="#d4a878"/>
    </linearGradient>
    <!-- Icon glows -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.5" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="900" height="300" fill="url(#dots)"/>

  <!-- ==================== BOX (centered ~x=220) ==================== -->
  <g filter="url(#boxShadow)" transform="translate(140, 70)">
    <!-- Box body: front face -->
    <path d="M0,95 L130,95 L130,190 L0,190 Z" fill="url(#boxFront)"/>
    <!-- Crease line -->
    <line x1="65" y1="95" x2="65" y2="190" stroke="#b8854e" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Box body: right face -->
    <path d="M130,95 L175,70 L175,165 L130,190 Z" fill="url(#boxRight)"/>
    
    <!-- Box tape (front) -->
    <rect x="57" y="95" width="16" height="95" fill="#c4a06a" opacity="0.35" rx="1"/>
    <!-- Box tape (top edge) -->
    <line x1="65" y1="95" x2="65" y2="80" stroke="#c4a06a" stroke-width="8" opacity="0.2" stroke-linecap="round"/>

    <!-- Open flap: left -->
    <path d="M0,95 L-8,68 L55,55 L65,95 Z" fill="url(#flapL)" stroke="#b8854e" stroke-width="0.6"/>
    <!-- Open flap: right -->
    <path d="M65,95 L75,48 L140,42 L130,95 Z" fill="url(#flapR)" stroke="#b8854e" stroke-width="0.6"/>
    <!-- Open flap: back-right -->
    <path d="M130,95 L140,42 L185,32 L175,70 Z" fill="url(#flapBack)" stroke="#b8854e" stroke-width="0.6"/>

    <!-- Box edge highlights -->
    <line x1="0" y1="95" x2="130" y2="95" stroke="#e8c49a" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="190" x2="130" y2="190" stroke="#7d5a38" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- ==================== ICONS FLOATING OUT ==================== -->
  
  <!-- Home icon -->
  <g transform="translate(195, 60)" filter="url(#glow)" opacity="0.95">
    <path d="M12,3 L2,12 L5,12 L5,20 L10,20 L10,14 L14,14 L14,20 L19,20 L19,12 L22,12 Z" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Search / magnifying glass -->
  <g transform="translate(255, 38)" filter="url(#glow)" opacity="0.9">
    <circle cx="10" cy="10" r="7" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="15" y1="15" x2="20" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Settings gear -->
  <g transform="translate(310, 55)" filter="url(#glow)" opacity="0.85">
    <circle cx="10" cy="10" r="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <path d="M10,1 L10,3 M10,17 L10,19 M1,10 L3,10 M17,10 L19,10 M3.5,3.5 L5,5 M15,15 L16.5,16.5 M16.5,3.5 L15,5 M5,15 L3.5,16.5" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- User/person -->
  <g transform="translate(225, 30)" filter="url(#glow)" opacity="0.8">
    <circle cx="8" cy="5" r="4" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <path d="M1,17 C1,12 4,10 8,10 C12,10 15,12 15,17" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Bell / notification -->
  <g transform="translate(280, 68)" filter="url(#glow)" opacity="0.85">
    <path d="M9,2 C9,1 10,0 11,0 C12,0 13,1 13,2 C16,3.5 17,6 17,9 L17,13 L19,15 L3,15 L5,13 L5,9 C5,6 6,3.5 9,2 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M9,15 C9,17 10,18 11,18 C12,18 13,17 13,15" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
  </g>

  <!-- Ambient sparkle particles -->
  <circle cx="185" cy="48" r="1.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="340" cy="45" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="310" cy="88" r="1.2" fill="#38bdf8" opacity="0.35"/>
  <circle cx="250" cy="22" r="1" fill="#f472b6" opacity="0.4"/>
  <circle cx="175" cy="75" r="0.8" fill="#fbbf24" opacity="0.3"/>

  <!-- ==================== TEXT ==================== -->
  <text x="590" y="148" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="5">ICON</text>
  <text x="590" y="205" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="300" font-size="48" fill="#6b7280" letter-spacing="14">MCP</text>

  <!-- Accent line under text -->
  <line x1="500" y1="224" x2="680" y2="224" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
</svg>
