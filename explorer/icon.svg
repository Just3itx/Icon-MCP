<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#8b6544"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a07850"/>
      <stop offset="100%" stop-color="#7a5c3a"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4a878"/>
      <stop offset="100%" stop-color="#e0bb92"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow3" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="296" rx="14" fill="none" stroke="#1e1e2e" stroke-width="1"/>

  <!-- === CARDBOARD BOX (centered at x=200) === -->

  <!-- Box front face -->
  <path d="M140,170 L260,170 L260,250 L140,250 Z" fill="url(#boxFront)" stroke="#6b4c30" stroke-width="1.5"/>
  <!-- Box right side face -->
  <path d="M260,170 L295,148 L295,228 L260,250 Z" fill="url(#boxSide)" stroke="#6b4c30" stroke-width="1.5"/>
  <!-- Box tape stripe (front) -->
  <rect x="190" y="170" width="20" height="80" fill="#c4a46a" opacity="0.5"/>
  <!-- Box tape stripe (side) -->
  <path d="M260,170 L260,250 L265,247 L265,168 Z" fill="#b8935c" opacity="0.3"/>

  <!-- Open box flaps -->
  <!-- Left flap -->
  <path d="M140,170 L138,148 L185,138 L200,170 Z" fill="url(#boxTop)" stroke="#6b4c30" stroke-width="1.2"/>
  <!-- Right flap -->
  <path d="M200,170 L215,132 L268,128 L260,170 Z" fill="url(#boxTop)" stroke="#6b4c30" stroke-width="1.2"/>
  <!-- Back-right flap -->
  <path d="M260,170 L268,128 L303,120 L295,148 Z" fill="#c9a06e" stroke="#6b4c30" stroke-width="1.2"/>

  <!-- === ICONS POPPING OUT === -->

  <!-- Icon 1: Star (top-left, floating up) -->
  <g transform="translate(160, 105)" opacity="0.95">
    <polygon points="12,0 15,9 24,9 17,15 19,24 12,19 5,24 7,15 0,9 9,9" fill="url(#glow1)" stroke="#818cf8" stroke-width="0.5"/>
  </g>

  <!-- Icon 2: Heart (top-center, floating higher) -->
  <g transform="translate(205, 80)" opacity="0.9">
    <path d="M10,6 C10,2 15,-1 18,3 C18,3 18,3 18,3 C21,-1 26,2 26,6 C26,12 18,19 18,19 C18,19 10,12 10,6 Z" fill="url(#glow3)" stroke="#e879a0" stroke-width="0.5"/>
  </g>

  <!-- Icon 3: Gear/cog (right side, floating) -->
  <g transform="translate(255, 90)" opacity="0.9">
    <circle cx="11" cy="11" r="5" fill="none" stroke="url(#glow2)" stroke-width="2"/>
    <circle cx="11" cy="11" r="10" fill="none" stroke="url(#glow2)" stroke-width="2" stroke-dasharray="3 4"/>
  </g>

  <!-- Icon 4: Code brackets (far left, small) -->
  <g transform="translate(130, 120)" opacity="0.8">
    <text font-family="monospace" font-size="20" fill="#a78bfa" font-weight="700">&lt;/&gt;</text>
  </g>

  <!-- Icon 5: Lightning bolt (above box, small) -->
  <g transform="translate(232, 100)" opacity="0.85">
    <polygon points="8,0 3,10 7,10 5,18 13,7 9,7" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
  </g>

  <!-- Sparkle dots around box -->
  <circle cx="148" cy="100" r="2" fill="#818cf8" opacity="0.6"/>
  <circle cx="280" cy="85" r="1.5" fill="#f472b6" opacity="0.5"/>
  <circle cx="175" cy="78" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="245" cy="72" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="300" cy="110" r="1" fill="#a78bfa" opacity="0.4"/>

  <!-- === TEXT: ICON MCP === -->
  <text x="560" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="4">ICON</text>
  <text x="560" y="215" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="300" font-size="48" fill="#6b7280" letter-spacing="12">MCP</text>

  <!-- Subtle underline accent -->
  <line x1="470" y1="232" x2="650" y2="232" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
</svg>
